<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Glass Card</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: monospace;
    }

    body {
      min-height: 100vh;
      background: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Card container */
    .card {
      width: 200px;
      height: 300px;
      position: relative;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      overflow: hidden;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px);
    }

    /* Background layer */
    .card-bg {
      position: absolute;
      inset: 0;
      padding: 6px;
      background: linear-gradient(135deg, #a855f7, #f97316);
    }

    .card-bg-inner {
      width: 100%;
      height: 100%;
      background: #222;
      border-radius: 16px 80px 40px 16px;
    }

    /* Center spinning circle */
    .spinner-wrapper {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      backdrop-filter: blur(10px);
    }

    .spinner {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: linear-gradient(45deg, #a855f7, #f97316);
      animation: spin 12s linear infinite;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Content layer */
    .content {
      position: absolute;
      inset: 0;
      padding: 12px;
      display: flex;
      justify-content: space-between;
      color: white;
    }

    .left-box {
      width: 60%;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 12px;
      padding: 10px;
      display: flex;
      flex-direction: column;
    }

    .left-box h3 {
      font-size: 18px;
      margin-bottom: 4px;
    }

    .left-box p {
      font-size: 12px;
      color: #cbd5f5;
    }

    .left-box span {
      margin-top: auto;
      text-align: center;
      font-size: 12px;
      color: #cbd5f5;
    }

    .right-box {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      font-size: 10px;
      color: rgba(255,255,255,0.6);
    }

    .arrow {
      margin-top: auto;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .arrow:hover {
      background: rgba(255, 255, 255, 0.35);
    }

    .arrow svg {
      width: 16px;
      height: 16px;
      fill: white;
    }
  </style>
</head>
<body>

  <div class="card">

    <div class="card-bg">
      <div class="card-bg-inner"></div>
    </div>

    <div class="spinner-wrapper">
      <div class="spinner"></div>
    </div>

    <div class="content">
      <div class="left-box">
        <h3>Card</h3>
        <p>text</p>
        <span>2026</span>
      </div>

      <div class="right-box">
        <div>Brijendra</div>
        <div>card</div>

        <div class="arrow">
          <svg viewBox="0 0 12 12">
            <path d="M4.6 2.1a.5.5 0 0 0 0 .7L7.8 6 4.6 9.1a.5.5 0 1 0 .7.7l3.5-3.5a.5.5 0 0 0 0-.7L5.3 2.1a.5.5 0 0 0-.7 0z"/>
          </svg>
        </div>
      </div>
    </div>

  </div>

</body>
</html>
