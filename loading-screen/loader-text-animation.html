<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Simple Loader</title>
<style>
body {
  background: #0f172a;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.loader {
  font-size: 3rem;
  font-weight: bold;
  color: white;
  position: relative;
}

.loader::after {
  content: "";
  position: absolute;
  left: 0;
  bottom: -8px;
  width: 100%;
  height: 4px;
  background: white;
  animation: loading 2s infinite ease-in-out;
}

@keyframes loading {
  0% { transform: scaleX(0); }
  50% { transform: scaleX(1); }
  100% { transform: scaleX(0); }
}
</style>
</head>
<body>

<div class="loader">Loading</div>

</body>
</html>
